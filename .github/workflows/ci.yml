name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 25 = build target (LTS); 27 = latest feature release, bump when a new JDK ships.
        include:
          - java: '25'
            maven-args: ''
          - java: '27'
            # palantir-java-format cannot run on JDK 27 yet (palantir/palantir-java-format#1785).
            # Formatting does not depend on the JDK, so the Java 25 job checks it.
            maven-args: '-Dspotless.check.skip=true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and verify
        run: ./mvnw -B -ntp verify ${{ matrix.maven-args }}

      - name: Upload SBOM
        if: matrix.java == '25'
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: target/spring-inspector-bom.json

      - name: Upload coverage reports
        if: matrix.java == '25'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore

  plugin:
    name: IntelliJ plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build the command line the plugin bundles
        run: ./mvnw -B -ntp package -DskipTests -Djacoco.check.skip=true

      - name: Test and package the plugin
        working-directory: inspector-intellij
        run: ./gradlew --no-daemon test buildPlugin verifyPluginStructure

      # The verifier downloads the IDEs it checks against (several GB); remove preinstalled toolchains we do not use.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Check compatibility with the supported IDEs
        working-directory: inspector-intellij
        run: |
          set -o pipefail
          ./gradlew --no-daemon verifyPlugin 2>&1 | tee verify-plugin.log

      # Puts the verifier's verdict into the run's annotations, which are readable without opening the log.
      - name: Report compatibility problems
        if: failure()
        working-directory: inspector-intellij
        run: |
          summary=$(grep -E "Plugin .* against|Compatibility problems|problem|Exception|error|FAILED|What went wrong" verify-plugin.log | head -40)
          echo "::error title=Plugin Verifier::${summary//$'\n'/%0A}"
          find build/reports/pluginVerifier -type f \( -name '*.md' -o -name '*.txt' \) -print0 2>/dev/null | xargs -0 -r cat | head -80 > problems.txt || true
          if [ -s problems.txt ]; then
            content=$(cat problems.txt)
            echo "::error title=Verifier report::${content//$'\n'/%0A}"
          fi
