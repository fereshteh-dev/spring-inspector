name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 25 = build target (LTS); 27 = latest feature release, bump when a new JDK ships.
        include:
          - java: '25'
            maven-args: ''
          - java: '27'
            # palantir-java-format cannot run on JDK 27 yet (palantir/palantir-java-format#1785).
            # Formatting does not depend on the JDK, so the Java 25 job checks it.
            maven-args: '-Dspotless.check.skip=true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and verify
        run: ./mvnw -B -ntp verify ${{ matrix.maven-args }}

      - name: Upload SBOM
        if: matrix.java == '25'
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: target/spring-inspector-bom.json

      - name: Upload coverage reports
        if: matrix.java == '25'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore
